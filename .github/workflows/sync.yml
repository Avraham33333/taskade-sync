name: Taskade to Drive sync
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days back to sync'
        required: false
        default: '5'
concurrency:
  group: taskade-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install requests google-auth google-auth-oauthlib google-api-python-client
      - name: Run sync
        env:
          TASKADE_TOKEN: ${{ secrets.TASKADE_TOKEN }}
          TASKADE_SUBSPACE_ID: ${{ secrets.TASKADE_SUBSPACE_ID }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          RECENT_DAYS: ${{ inputs.days || '5' }}
        run: python sync_recent_cloud.py
